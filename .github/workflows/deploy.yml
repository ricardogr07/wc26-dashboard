name: Deploy

# Manual trigger only until Phase 10 sets up automatic on-push deployment.
# Also triggered by infra-toggle.yml when turning infra back on.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  # ── Gate: CI must pass before any Azure resource is touched ─────────────────
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Infra: apply Terraform, capture outputs for downstream jobs ──────────────
  infra:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: [ci]
    environment: production
    outputs:
      function_app_name: ${{ steps.tf_outputs.outputs.function_app_name }}
      function_app_url: ${{ steps.tf_outputs.outputs.function_app_url }}
      static_web_app_token: ${{ steps.tf_outputs.outputs.static_web_app_token }}
      static_web_app_url: ${{ steps.tf_outputs.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve
        env:
          TF_VAR_thesportsdb_api_key: ${{ secrets.THESPORTSDB_API_KEY }}

      - name: Capture outputs
        id: tf_outputs
        working-directory: infra
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"
          echo "function_app_url=$(terraform output -raw function_app_url)" >> "$GITHUB_OUTPUT"
          echo "static_web_app_url=$(terraform output -raw static_web_app_url)" >> "$GITHUB_OUTPUT"
          SWA_TOKEN=$(terraform output -raw static_web_app_deployment_token)
          echo "::add-mask::$SWA_TOKEN"
          echo "static_web_app_token=$SWA_TOKEN" >> "$GITHUB_OUTPUT"

  # ── Deploy API ───────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: [infra]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Generate requirements.txt
        run: uv export --no-dev --format requirements-txt -o api/requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/functions-action@v1
        with:
          app-name: ${{ needs.infra.outputs.function_app_name }}
          package: api

  # ── Smoke test: API ──────────────────────────────────────────────────────────
  smoke-api:
    name: Smoke test — API
    runs-on: ubuntu-latest
    needs: [infra, deploy-api]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: ./.github/actions/smoke-api
        with:
          function-app-name: ${{ needs.infra.outputs.function_app_name }}
          resource-group: wc26-dashboard-rg

  # ── Deploy Web ───────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Static Web App
    runs-on: ubuntu-latest
    needs: [infra]
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ needs.infra.outputs.static_web_app_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: out
          skip_app_build: true

  # ── Smoke test: Web ──────────────────────────────────────────────────────────
  smoke-web:
    name: Smoke test — Web
    runs-on: ubuntu-latest
    needs: [infra, deploy-web]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/smoke-web
        with:
          url: ${{ needs.infra.outputs.static_web_app_url }}

  # ── End-to-end smoke ─────────────────────────────────────────────────────────
  e2e-smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [infra, smoke-api, smoke-web]
    steps:
      - name: All components healthy
        run: |
          echo "API:  ${{ needs.infra.outputs.function_app_url }}"
          echo "Web:  ${{ needs.infra.outputs.static_web_app_url }}"
          echo "Both smoke tests passed — deployment complete."
