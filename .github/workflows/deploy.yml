name: Deploy

# No automatic trigger until infrastructure and the full app are ready (Phase 10).
# Run manually from the Actions tab when needed.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  infra:
    name: Terraform apply
    runs-on: ubuntu-latest
    environment: production
    outputs:
      function_app_name: ${{ steps.tf_outputs.outputs.function_app_name }}
      static_web_app_token: ${{ steps.tf_outputs.outputs.static_web_app_deployment_token }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve
        env:
          TF_VAR_thesportsdb_api_key: ${{ secrets.THESPORTSDB_API_KEY }}

      - name: Capture outputs
        id: tf_outputs
        working-directory: infra
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: infra
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install production dependencies
        run: uv export --no-dev --format requirements-txt -o api/requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/functions-action@v1
        with:
          app-name: ${{ needs.infra.outputs.function_app_name }}
          package: api

  deploy-web:
    name: Deploy Static Web App
    runs-on: ubuntu-latest
    needs: infra
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: out
          skip_app_build: true
