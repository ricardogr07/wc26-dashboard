name: "CI — API"
description: "Lint, type-check, and test the Python API with tox"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true

    - name: Run tox (lint → typecheck → test)
      run: uv tool run tox
      shell: bash
