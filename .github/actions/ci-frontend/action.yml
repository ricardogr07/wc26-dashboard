name: "CI - Frontend"
description: "Type-check and lint the Next.js frontend"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      if: hashFiles('web/package.json') != ''
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node
      if: hashFiles('web/package.json') != ''
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "pnpm"
        cache-dependency-path: web/pnpm-lock.yaml

    - name: Install dependencies
      if: hashFiles('web/package.json') != ''
      run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web

    - name: Type check
      if: hashFiles('web/package.json') != ''
      run: pnpm type-check
      shell: bash
      working-directory: web

    - name: Lint
      if: hashFiles('web/package.json') != ''
      run: pnpm lint
      shell: bash
      working-directory: web
