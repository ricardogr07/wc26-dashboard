name: Smoke test — API
description: Verifies the Azure Function App is Running and returns real data after deployment.

inputs:
  function-app-name:
    description: Name of the Azure Function App
    required: true
  resource-group:
    description: Resource group containing the Function App
    required: true
    default: wc26-dashboard-rg
  function-app-url:
    description: Base HTTPS URL of the deployed Function App (e.g. https://my-func.azurewebsites.net)
    required: true

runs:
  using: composite
  steps:
    - name: Wait for Function App to reach Running state
      shell: bash
      run: |
        echo "Polling state of Function App: ${{ inputs.function-app-name }}"
        for i in $(seq 1 8); do
          STATE=$(az functionapp show \
            --name "${{ inputs.function-app-name }}" \
            --resource-group "${{ inputs.resource-group }}" \
            --query "properties.state" \
            --output tsv 2>/dev/null || true)
          echo "Attempt $i/8: state=$STATE"
          if [ "$STATE" = "Running" ]; then
            echo "Function App is Running."
            exit 0
          fi
          sleep 15
        done
        echo "::error::Function App did not reach Running state after 2 minutes (last state: $STATE)"
        exit 1

    - name: Validate standings endpoint returns data
      shell: bash
      run: |
        echo "Checking ${{ inputs.function-app-url }}/api/standings"
        RESP=$(curl -sf --retry 3 --retry-delay 5 \
          "${{ inputs.function-app-url }}/api/standings")
        COUNT=$(echo "$RESP" | jq '.standings | length')
        if [ "$COUNT" -lt 1 ]; then
          echo "::error::standings returned 0 entries — DB may not be seeded"
          exit 1
        fi
        echo "standings OK: $COUNT entries"
