[project]
name = "wc26-api"
version = "0.1.0"
description = "Quiniela Mundial 2026 — Azure Functions API"
requires-python = ">=3.11"
dependencies = [
    "azure-functions>=1.21",
    "azure-cosmos>=4.9",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyrefly>=0.17",
]

[tool.uv]
default-groups = ["dev"]

[tool.tox]
requires = ["tox>=4.23", "tox-uv>=1.16"]
env_list = ["lint", "typecheck", "test"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"

[tool.tox.env.lint]
description = "Lint and format check with ruff"
deps = ["ruff"]
commands = [
    ["ruff", "check", "api/"],
    ["ruff", "format", "--check", "api/"],
]

[tool.tox.env.typecheck]
description = "Type-check with pyrefly"
deps = [
    "pyrefly>=0.17",
    "azure-functions>=1.21",
    "azure-cosmos>=4.9",
    "pydantic>=2.8",
    "httpx>=0.27",
]
commands = [["pyrefly", "check", "api/"]]

[tool.tox.env.test]
description = "Run unit tests with pytest"
deps = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pydantic>=2.8",
]
commands = [
    ["pytest", "api/tests/", "--cov=api", "--cov-report=term-missing", "-v"],
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["api"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pyrefly]
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
