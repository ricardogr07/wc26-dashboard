services:
  # Azure Storage emulator — required by the Functions runtime for internal state.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Bind-mount the repo root so code changes are reflected without rebuilding.
    volumes:
      - .:/home/site/wwwroot
    # Secrets and emulator connection strings come from .env.local (gitignored).
    # Copy .env.local.example to .env.local and fill in your values before starting.
    env_file: .env.local
    environment:
      FUNCTIONS_WORKER_RUNTIME: python
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "7071:80"
    depends_on:
      - azurite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      # Browser JS calls hit localhost:7071 (mapped from the api container's port 80).
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:7071"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
