services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: wc26-cosmos-emulator
    ports:
      - "8081:8081"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=10
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
    volumes:
      - cosmos-emulator-data:/tmp/cosmos
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8081/_explorer/emulator.pem -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  cosmos-emulator-data:
